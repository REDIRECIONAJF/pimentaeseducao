<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pimenta e Sedução | Links</title>
<meta name="description" content="Moda, estilo e personalidade para valorizar a beleza e a autoestima de cada mulher.">
<meta name="theme-color" content="#FAF7F5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF7F5;
    --red: #D8202C;
    --red-dark: #B01722;
    --black: #1A1A1A;
    --muted: #5E5654;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--black);
    font-family: "Nunito", "Varela Round", "Trebuchet MS", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 40px 20px 28px;
  }
  main { width: 100%; max-width: 460px; text-align: center; flex: 1; }
  .logo {
    width: 100%;
    max-width: 340px;
    height: auto;
    mix-blend-mode: multiply;
    animation: rise .7s ease both;
  }
  .tagline {
    margin: 14px auto 30px;
    max-width: 380px;
    font-size: 1.02rem;
    line-height: 1.5;
    font-weight: 600;
    color: var(--muted);
    animation: rise .7s ease .1s both;
  }
  .links { display: flex; flex-direction: column; gap: 14px; }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 16px 22px;
    border-radius: 999px;
    background: var(--red);
    color: #fff;
    text-decoration: none;
    font-weight: 800;
    font-size: 1.05rem;
    box-shadow: 0 6px 16px rgba(216, 32, 44, .28);
    transition: transform .25s ease, box-shadow .25s ease, background .25s ease;
    animation: rise .6s ease both;
    animation-delay: calc(.25s + var(--i) * .12s);
  }
  .btn:hover, .btn:focus-visible {
    background: var(--black);
    transform: translateY(-3px);
    box-shadow: 0 12px 22px rgba(0, 0, 0, .25);
  }
  .btn:active { transform: translateY(0); }
  .btn:focus-visible { outline: 3px solid var(--red); outline-offset: 3px; }
  footer {
    margin-top: 36px;
    font-size: .85rem;
    color: var(--muted);
    opacity: .8;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
